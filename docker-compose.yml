# SWAPMART — self-contained local development stack.
# Production uses managed services (Vercel + Railway + managed PostgreSQL +
# Cloudinary); this file is for local development and demonstration only.
services:
  db:
    image: postgres:17-alpine
    container_name: swapmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: swapmart
      POSTGRES_PASSWORD: swapmart
      POSTGRES_DB: swapmart
    ports:
      - '5432:5432'
    volumes:
      - swapmart-db:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swapmart -d swapmart']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: swapmart-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgres://swapmart:swapmart@db:5432/swapmart
      DATABASE_SSL: 'false'
      API_URL: http://localhost:4000
      APP_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      IDENTIFIER_ENCRYPTION_KEY: ${IDENTIFIER_ENCRYPTION_KEY:?set IDENTIFIER_ENCRYPTION_KEY}
      IDENTIFIER_HASH_SECRET: ${IDENTIFIER_HASH_SECRET:?set IDENTIFIER_HASH_SECRET}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      LOCAL_MEDIA_DIR: /app/var/media
      RUN_MIGRATIONS_ON_START: 'true'
    ports:
      - '4000:4000'
    volumes:
      - swapmart-media:/app/var/media

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:4000
    container_name: swapmart-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: '3000'
      INTERNAL_API_URL: http://api:4000
      API_URL: http://api:4000
    ports:
      - '3000:3000'

volumes:
  swapmart-db:
  swapmart-media:
